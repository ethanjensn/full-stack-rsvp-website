<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ config.COUPLE_DISPLAY_NAME }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-label="Wedding invitation">
        <!-- Optional invitation card image can be reintroduced here once the asset is available -->
      </section>

      <section class="details">
        <div class="details__container">
          <h1 class="names">{{ config.COUPLE_DISPLAY_NAME_HTML|safe }}</h1>

          <div class="actions" aria-label="RSVP">
            <a class="btn" href="{{ url_for('rsvp') }}">RSVP</a>
            <a class="btn" href="{{ url_for('qa') }}">Q&A</a>
            <a class="btn" href="{{ config.REGISTRY_URL }}" target="_blank">REGISTRY</a>
          </div>

          <div class="info" aria-label="Event details">
            <div class="info__block">
              <div class="info__label info__label--title">Date</div>
              <div class="info__divider"></div>
              <div class="info__calendar-text">
                <div class="info__label info__label--date">{{ config.EVENT_DATE_DISPLAY }}</div>
                <div class="info__schedule">
                  {% for line in config.EVENT_SCHEDULE_LINES %}
                  <div class="info__label">{{ line|safe }}</div>
                  {% endfor %}
                </div>
              </div>
              <div class="calendar-widget">
                <a
                  class="btn calendar-widget__button"
                  href="{{ url_for('calendar') }}"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  Add to Calendar
                </a>
                <div class="calendar-widget__menu" hidden>
                  <a
                    class="calendar-widget__option"
                    href="{{ url_for('calendar') }}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Google Calendar
                  </a>
                  <a
                    class="calendar-widget__option"
                    href="{{ url_for('calendar_ics') }}"
                    download="wedding.ics"
                  >
                    Download .ics
                  </a>
                </div>
              </div>
            </div>
            <div class="info__block">
              <div class="info__label info__label--title">Location</div>
              <div class="info__divider"></div>
              <div class="info__map-text">
                <span class="info__label">{{ config.VENUE_NAME_UPPER }}</span>
                <span class="info__value">{{ config.VENUE_ADDRESS }}</span>
              </div>
              <a
                class="btn directions-button"
                href="{{ config.VENUE_DIRECTIONS_URL }}"
                target="_blank"
                rel="noopener noreferrer"
              >
                DIRECTIONS
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
  <script>
    // Ensure animations trigger on page load and all navigation
    function triggerAnimations() {
      // Force reflow to restart animations
      const animatedElements = document.querySelectorAll('.hero, .names, .actions, .info__block');
      animatedElements.forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight; // Trigger reflow
        el.style.animation = null;
      });
    }

    // Handle all types of page navigation
    document.addEventListener('DOMContentLoaded', triggerAnimations);

    // Handle back/forward navigation
    window.addEventListener('pageshow', triggerAnimations);

    // Calendar widget: route to the right calendar app per device.
    function initCalendarWidget() {
      const button = document.querySelector('.calendar-widget__button');
      const menu = document.querySelector('.calendar-widget__menu');
      if (!button || !menu) return;

      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua);
      const isAndroid = /Android/.test(ua);
      const host = window.location.host;

      if (isIOS) {
        // webcal:// opens Apple Calendar on iOS/iPadOS.
        button.href = 'webcal://' + host + '/calendar.ics';
        button.removeAttribute('target');
        button.removeAttribute('rel');
        menu.hidden = true;
      } else if (isAndroid) {
        // Google Calendar link is the most reliable pre-filled option on Android.
        button.href = '/calendar';
        menu.hidden = true;
      } else {
        // Desktop: show a dropdown with both options.
        button.href = '#';
        button.addEventListener('click', (event) => {
          event.preventDefault();
          const expanded = menu.hidden === false;
          menu.hidden = expanded;
          button.setAttribute('aria-expanded', String(!expanded));
        });

        // Close the dropdown when clicking elsewhere.
        document.addEventListener('click', (event) => {
          if (!button.contains(event.target) && !menu.contains(event.target)) {
            menu.hidden = true;
            button.setAttribute('aria-expanded', 'false');
          }
        });

        // Menu option clicks keep the menu hidden after selection.
        menu.querySelectorAll('a').forEach((link) => {
          link.addEventListener('click', () => {
            menu.hidden = true;
            button.setAttribute('aria-expanded', 'false');
          });
        });
      }
    }

    document.addEventListener('DOMContentLoaded', initCalendarWidget);
  </script>
</html>
